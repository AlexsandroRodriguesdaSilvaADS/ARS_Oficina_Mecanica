<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela de Torques de Suspensão - Seleção por Filtro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.14.0/devicon.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Raleway:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/estilos.css" />
    <link rel="stylesheet" href="./css/torque.css" />
    <link rel="stylesheet" href="./css/responsivo_torque.css" />
</head>

<body>
    <div class="main">
        <h1>Consulta de Torque Técnico</h1>

        <div class="filter-container">
            <!-- 1. Montadora -->
            <div class="filter-group">
                <label for="brandSelect">1. Selecione a Montadora:</label>
                <select id="brandSelect" onchange="updateVehicles()">
                    <option value="">-- Escolha a Montadora --</option>
                    <option value="honda">HONDA</option>
                    <option value="toyota">TOYOTA</option>
                    <option value="nissan">NISSAN</option>
                    <option value="fiat">FIAT</option>
                    <option value="volkswagen">VOLKSWAGEN</option>
                    <option value="chevrolet">CHEVROLET</option>
                    <option value="ford">FORD</option>
                    <option value="hyundai">HYUNDAI</option>
                    <option value="bmw">BMW</option>
                    <option value="mercedes">MERCEDES</option>
                    <option value="audi">AUDI</option>
                    <option value="volvo">VOLVO</option>
                    <option value="byd">BYD</option>
                </select>
            </div>

            <!-- 2. Veículo / Modelo -->
            <div class="filter-group">
                <label for="vehicleSelect">2. Selecione o Veículo:</label>
                <select id="vehicleSelect" onchange="updateSystems()" disabled>
                    <option value="">-- Selecione a Montadora Primeiro --</option>
                </select>
            </div>

            <!-- 3. Conjunto / Sistema -->
            <div class="filter-group">
                <label for="systemSelect">3. Selecione o Conjunto/Sistema:</label>
                <select id="systemSelect" onchange="updateComponents()" disabled>
                    <option value="">-- Selecione o Veículo Primeiro --</option>
                </select>
            </div>

            <!-- 4. Componente / Parafuso -->
            <div class="filter-group">
                <label for="componentSelect">4. Selecione o Componente / Parafuso:</label>
                <select id="componentSelect" onchange="showTorqueDetails()" disabled>
                    <option value="">-- Selecione o Conjunto Primeiro --</option>
                </select>
            </div>
        </div>

        <!-- Card de Resultados -->
        <div id="resultCard" class="result-card" style="display: none;">
            <h2 id="resTitle" style="margin-top:0; color:#2c5282;">-</h2>
            <div class="result-item">
                <span class="result-label">Torque:</span>
                <span id="resNm" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Torque:</span>
                <span id="resKgfm" class="result-value">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Observações / Procedimento:</span>
                <span id="resObs">-</span>
            </div>
        </div>
    </div>

    <script>
        // Banco de Sistemas e Componentes
        const systemsData = {
            susp_diant: {
                label: "Suspensão Dianteira",
                components: {
                    pivo: { name: "Pivô da Bandeja / Balança", nm: "55 Nm", kgfm: "5.6 Kgfm", obs: "Apertar com o veículo apoiado no chão (posição de trabalho)." },
                    bieleta: { name: "Bieleta da Barra Estabilizadora", nm: "40 Nm", kgfm: "4.1 Kgfm", obs: "Travar o pino allen/sextavado interno durante o torque." },
                    terminal_direcao: { name: "Terminal de Direção", nm: "45 Nm", kgfm: "4.6 Kgfm", obs: "Substituir a porca autofrenante se removida." },
                    amortecedor_inf: { name: "Amortecedor - Parafuso Inferior (Manga)", nm: "90 Nm + 45°", kgfm: "9.2 Kgfm + 45°", obs: "Respeitar a sequência de torque angular." },
                    amortecedor_sup: { name: "Torre do Amortecedor - Fixação Superior", nm: "45 Nm", kgfm: "4.6 Kgfm", obs: "Aperto junto à chapa do cofre do motor." }
                }
            },
            susp_tras: {
                label: "Suspensão Traseira",
                components: {
                    amortecedor_inf: { name: "Parafuso Inferior do Amortecedor", nm: "70 Nm", kgfm: "7.1 Kgfm", obs: "Apertar com o peso do veículo na suspensão." },
                    amortecedor_sup: { name: "Fixação Superior do Amortecedor", nm: "45 Nm", kgfm: "4.6 Kgfm", obs: "Não reutilizar porcas danificadas." },
                    bucha_eixo: { name: "Bucha do Eixo Traseiro", nm: "90 Nm", kgfm: "9.2 Kgfm", obs: "Aperto obrigatório na altura normal de rodagem." }
                }
            },
            transmissao: {
                label: "Transmissão, Embreagem e Transmissão Final",
                components: {
                    homocinetica: { name: "Porca da Junta Homocinética (Cubo de Roda)", nm: "210 Nm", kgfm: "21.4 Kgfm", obs: "Travar a borda da porca no entalhe do eixo/fuso." },
                    plato: { name: "Parafusos do Platô de Embreagem", nm: "25 Nm", kgfm: "2.5 Kgfm", obs: "Apertar em cruz/diagonais progressivamente para não empenar o platô." },
                    volante_motor: { name: "Parafusos do Volante do Motor", nm: "60 Nm + 90°", kgfm: "6.1 Kgfm + 90°", obs: "Aplicar trava química de alta resistência e trocar parafusos." },
                    atuador_hidraulico: { name: "Parafusos do Atuador Hidráulico (Concêntrico)", nm: "10 Nm", kgfm: "1.0 Kgfm", obs: "Apertar com cuidado para não danificar a carcaça de alumínio/plástico." },
                    garfo_embreagem: { name: "Pivô / Suporte do Garfo de Embreagem", nm: "35 Nm", kgfm: "3.5 Kgfm", obs: "Aplicar graxa sintética nos pontos de articulação." },
                    caixa_cambio: { name: "Parafusos de Fixação do Câmbio ao Motor", nm: "75 Nm", kgfm: "7.6 Kgfm", obs: "Garantir o perfeito encaixe nos guias do bloco." },
                    coxim_cambio: { name: "Coxim do Câmbio / Suporte Superior", nm: "60 Nm + 45°", kgfm: "6.1 Kgfm + 45°", obs: "Verificar a integridade do calço vulcanizado." }
                }
            },
            freios_rodas: {
                label: "Freios e Rodas",
                components: {
                    parafuso_roda: { name: "Parafusos / Porcas de Roda", nm: "120 Nm", kgfm: "12.2 Kgfm", obs: "Apertar em cruz/estrela. Nunca aplicar graxa ou óleo nas roscas das porcas/parafusos." },
                    pinca_suporte: { name: "Suporte da Pinça de Freio (Cavalete)", nm: "100 Nm", kgfm: "10.2 Kgfm", obs: "Aplicar trava química de média densidade (Trava Rosca)." },
                    pinca_deslizante: { name: "Pinos Deslizantes da Pinça de Freio", nm: "30 Nm", kgfm: "3.0 Kgfm", obs: "Lubrificar pinos com graxa de silicone própria para freio." }
                }
            }
        };

        // Lista de Veículos por Montadora
        const vehiclesByBrand = {
            honda: ["Accord", "City", "Civic", "CR-V", "Fit", "HR-V", "WR-V", "ZR-V"],
            toyota: ["Bandeirante", "Camry", "Corolla", "Corolla Cross", "Corolla Fielder", "Etios", "Hilux", "Prius", "RAV4", "SW4", "Yaris"],
            nissan: ["Frontier", "Kicks", "Livina / Grand Livina", "March", "Sentra", "Tiida", "Versa / V-Drive", "X-Trail"],
            fiat: ["500", "Argo", "Bravo", "Cronos", "Doblò", "Ducato", "Fastback", "Fiorino", "Freemont", "Grand Siena", "Idea", "Linea", "Marea", "Mobi", "Palio", "Pulse", "Punto", "Siena", "Stilo", "Strada", "Toro", "Uno / Mille"],
            volkswagen: ["Amarok", "Bora", "Fox / CrossFox / SpaceFox", "Fusca / New Beetle", "Gol", "Golf", "Jetta", "Kombi", "Nivus", "Parati", "Passat", "Polo", "Santana", "Saveiro", "Taos", "T-Cross", "Tiguan", "Up!", "Virtus", "Voyage"],
            chevrolet: ["Agile", "Astra", "Blazer", "Camaro", "Captiva", "Celta", "Chevette", "Cobalt", "Corsa", "Cruze", "Equinox", "Kadett", "Meriva", "Montana", "Omega", "Onix / Onix Plus", "Opala", "Prisma", "S10", "Spin", "Tracker", "Vectra", "Zafira"],
            ford: ["Courier", "EcoSport", "Edge", "Escort", "F-1000", "F-250", "Fiesta / New Fiesta", "Focus", "Fusion", "Ka / Ka+", "Maverick", "Mustang", "Ranger", "Territory / Bronco"],
            hyundai: ["Azera", "Creta", "Elantra", "HB20 / HB20S", "HR", "i30", "ix35", "Santa Fe", "Sonata", "Tucson", "Veloster", "Veracruz"],
            bmw: ["Série 1", "Série 2", "Série 3", "Série 4", "Série 5", "X1", "X2", "X3", "X4", "X5", "X6", "Z4"],
            mercedes: ["Classe A", "Classe B", "Classe C", "Classe E", "CLA", "GLA", "GLB", "GLC", "GLE", "Sprinter"],
            audi: ["A1", "A3", "A4", "A5", "A6", "Q3", "Q5", "Q7", "TT", "e-tron"],
            volvo: ["C30", "C40", "EX30", "S60", "S90", "V40", "V60", "XC40", "XC60", "XC90"],
            byd: ["Dolphin / Dolphin Mini", "Song Plus / Song Pro", "Seal", "Yuan Plus", "King DM-i", "Tan EV", "Han EV", "Shark"]
        };

        // Passo 1 -> Passo 2: Atualiza a lista de Veículos
        function updateVehicles() {
            const brand = document.getElementById('brandSelect').value;
            const vehicleSelect = document.getElementById('vehicleSelect');
            const systemSelect = document.getElementById('systemSelect');
            const componentSelect = document.getElementById('componentSelect');

            vehicleSelect.innerHTML = '<option value="">-- Selecione o Veículo --</option>';
            systemSelect.innerHTML = '<option value="">-- Selecione o Veículo Primeiro --</option>';
            componentSelect.innerHTML = '<option value="">-- Selecione o Conjunto Primeiro --</option>';

            systemSelect.disabled = true;
            componentSelect.disabled = true;
            document.getElementById('resultCard').style.display = 'none';

            if (brand && vehiclesByBrand[brand]) {
                vehiclesByBrand[brand].sort().forEach(vehicle => {
                    let opt = document.createElement('option');
                    opt.value = vehicle;
                    opt.textContent = vehicle;
                    vehicleSelect.appendChild(opt);
                });
                vehicleSelect.disabled = false;
            } else {
                vehicleSelect.disabled = true;
                vehicleSelect.innerHTML = '<option value="">-- Selecione a Montadora Primeiro --</option>';
            }
        }

        // Passo 2 -> Passo 3: Atualiza os Sistemas/Conjuntos
        function updateSystems() {
            const vehicle = document.getElementById('vehicleSelect').value;
            const systemSelect = document.getElementById('systemSelect');
            const componentSelect = document.getElementById('componentSelect');

            systemSelect.innerHTML = '<option value="">-- Selecione o Conjunto/Sistema --</option>';
            componentSelect.innerHTML = '<option value="">-- Selecione o Conjunto Primeiro --</option>';

            componentSelect.disabled = true;
            document.getElementById('resultCard').style.display = 'none';

            if (vehicle) {
                for (let key in systemsData) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = systemsData[key].label;
                    systemSelect.appendChild(opt);
                }
                systemSelect.disabled = false;
            } else {
                systemSelect.disabled = true;
            }
        }

        // Passo 3 -> Passo 4: Atualiza os Componentes / Parafusos
        function updateComponents() {
            const systemKey = document.getElementById('systemSelect').value;
            const componentSelect = document.getElementById('componentSelect');

            componentSelect.innerHTML = '<option value="">-- Selecione o Componente / Parafuso --</option>';
            document.getElementById('resultCard').style.display = 'none';

            if (systemKey && systemsData[systemKey]) {
                const components = systemsData[systemKey].components;
                for (let key in components) {
                    let opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = components[key].name;
                    componentSelect.appendChild(opt);
                }
                componentSelect.disabled = false;
            } else {
                componentSelect.disabled = true;
            }
        }

        // Passo 4: Exibe o Resultado do Torque
        function showTorqueDetails() {
            const vehicle = document.getElementById('vehicleSelect').value;
            const systemKey = document.getElementById('systemSelect').value;
            const componentKey = document.getElementById('componentSelect').value;
            const resultCard = document.getElementById('resultCard');

            if (vehicle && systemKey && componentKey) {
                const item = systemsData[systemKey].components[componentKey];

                document.getElementById('resTitle').textContent = `${vehicle} - ${item.name}`;
                document.getElementById('resNm').textContent = item.nm;
                document.getElementById('resKgfm').textContent = item.kgfm;
                document.getElementById('resObs').textContent = item.obs;

                resultCard.style.display = 'block';
            } else {
                resultCard.style.display = 'none';
            }
        }
    </script>


</body>

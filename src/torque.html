        // LÓGICA DE INTERFACE E SELEÇÃO
        function updateVehicles() {
            const brand = document.getElementById("brandSelect").value;
            const vehicleSelect = document.getElementById("vehicleSelect");
            const systemSelect = document.getElementById("systemSelect");
            const componentSelect = document.getElementById("componentSelect");

            resetSelect(vehicleSelect, "-- Selecione o Veículo --");
            resetSelect(systemSelect, "-- Selecione o Veículo Primeiro --");
            resetSelect(componentSelect, "-- Selecione o Conjunto Primeiro --");
            hideResultCard();

            if (!brand || !vehiclesDatabase[brand]) {
                vehicleSelect.disabled = true;
                return;
            }

            vehicleSelect.disabled = false;
            const vehicles = Object.keys(vehiclesDatabase[brand]);

            vehicles.forEach(model => {
                let opt = document.createElement("option");
                opt.value = model;
                opt.textContent = model;
                vehicleSelect.appendChild(opt);
            });
        }

        function updateSystems() {
            const brand = document.getElementById("brandSelect").value;
            const model = document.getElementById("vehicleSelect").value;
            const systemSelect = document.getElementById("systemSelect");
            const componentSelect = document.getElementById("componentSelect");

            resetSelect(systemSelect, "-- Selecione o Conjunto/Sistema --");
            resetSelect(componentSelect, "-- Selecione o Conjunto Primeiro --");
            hideResultCard();

            if (!model) {
                systemSelect.disabled = true;
                return;
            }

            systemSelect.disabled = false;
            const systems = vehiclesDatabase[brand][model];

            for (let sysKey in systems) {
                let opt = document.createElement("option");
                opt.value = sysKey;
                opt.textContent = systems[sysKey].label;
                systemSelect.appendChild(opt);
            }
        }

            const sysKey = document.getElementById("systemSelect").value;
            const componentSelect = document.getElementById("componentSelect");

            resetSelect(componentSelect, "-- Selecione o Componente --");
            hideResultCard();

            if (!sysKey) {
                componentSelect.disabled = true;
                return;
            }

            componentSelect.disabled = false;
            const components = vehiclesDatabase[brand][model][sysKey].components;

            for (let compKey in components) {
                let opt = document.createElement("option");
                opt.value = compKey;
                opt.textContent = components[compKey].name;
                componentSelect.appendChild(opt);
            }
        }

        function showTorqueDetails() {
            const brand = document.getElementById("brandSelect").value;
            const model = document.getElementById("vehicleSelect").value;
            const sysKey = document.getElementById("systemSelect").value;
            const compKey = document.getElementById("componentSelect").value;

            if (!compKey) {
                hideResultCard();
                return;
            }

            const comp = vehiclesDatabase[brand][model][sysKey].components[compKey];

            document.getElementById("resTitle").textContent = `${model} - ${comp.name}`;
            document.getElementById("resNm").textContent = comp.nm;
            document.getElementById("resKgfm").textContent = comp.kgfm;
            document.getElementById("resObs").textContent = comp.obs || "Nenhuma observação informada.";

            document.getElementById("resultCard").style.display = "block";
        }

        function resetSelect(selectElem, defaultText) {
            selectElem.innerHTML = `<option value="">${defaultText}</option>`;
            selectElem.disabled = true;
        }

        function hideResultCard() {
            document.getElementById("resultCard").style.display = "none";
        }
    </script>
</body>

</html>

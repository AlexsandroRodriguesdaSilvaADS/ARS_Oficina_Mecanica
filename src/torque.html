        <div class="filter-group">
            <label for="brandSelect">1. Selecione a Montadora:</label>

                <option value="honda">HONDA</option>

        <!-- Select 2: Seleção de Subsistema -->
        <div class="filter-group">
            <label for="systemSelect">2. Selecione o Conjunto/Eixo:</label>
            <select id="systemSelect" onchange="updateComponents()" disabled>
                <option value="">-- Selecione a Montadora Primeiro --</option>
            </select>
        </div>

        <!-- Select 3: Seleção de Componente Específico -->
        <div class="filter-group">
            <label for="componentSelect">3. Selecione o Componente / Parafuso:</label>
            <select id="componentSelect" onchange="showTorqueDetails()" disabled>
                <option value="">-- Selecione o Conjunto Primeiro --</option>
            </select>
        </div>
    </div>

    <!-- Painel para Exibição dos Detalhes Selecionados -->

        </div>
        <div class="result-item">
            <span class="result-label">Torque (kgfm):</span>

        </div>
        <div class="result-item">
            <span class="result-label">Observações / Procedimento:</span>
            <span id="resObs">-</span>
        </div>
    </div>

        function updateSubsystems() {
            const brand = document.getElementById("brandSelect").value;
            const systemSelect = document.getElementById("systemSelect");
            const componentSelect = document.getElementById("componentSelect");

            systemSelect.innerHTML = '<option value="">-- Selecione o Conjunto/Eixo --</option>';
            componentSelect.innerHTML = '<option value="">-- Selecione o Conjunto Primeiro --</option>';
            componentSelect.disabled = true;
            document.getElementById("resultCard").classList.remove("active");

            if (brand && database[brand]) {
                systemSelect.disabled = false;
                Object.keys(database[brand]).forEach(sys => {
                    const opt = document.createElement("option");
                    opt.value = sys;
                    opt.textContent = sys;
                    systemSelect.appendChild(opt);
                });
            } else {
                systemSelect.disabled = true;
            }
        }

        function updateComponents() {
            const brand = document.getElementById("brandSelect").value;
            const system = document.getElementById("systemSelect").value;
            const componentSelect = document.getElementById("componentSelect");

            componentSelect.innerHTML = '<option value="">-- Selecione o Componente --</option>';
            document.getElementById("resultCard").classList.remove("active");

            if (brand && system && database[brand][system]) {
                componentSelect.disabled = false;
                database[brand][system].forEach((comp, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.textContent = comp.name;
                    componentSelect.appendChild(opt);
                });
            } else {
                componentSelect.disabled = true;
            }
        }

        function showTorqueDetails() {
            const brand = document.getElementById("brandSelect").value;
            const system = document.getElementById("systemSelect").value;
            const index = document.getElementById("componentSelect").value;
            const card = document.getElementById("resultCard");

            if (index !== "" && database[brand][system][index]) {
                const item = database[brand][system][index];
                document.getElementById("resTitle").textContent = item.name;
                document.getElementById("resNm").textContent = item.nm;
                document.getElementById("resKgfm").textContent = item.kgfm;

                const obsElem = document.getElementById("resObs");
                obsElem.textContent = item.obs;
                if (item.highlight) {
                    obsElem.className = "highlight";
                } else {
                    obsElem.className = "";
                }

                card.classList.add("active");
            } else {
                card.classList.remove("active");
            }
        }
